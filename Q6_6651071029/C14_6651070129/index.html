<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Home</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!--IMAGE EFFECT-->
    <div class="image-effect" id="image-effect-2">
        <img src="images/off.png" class="fadeEffect">
        <img src="images/on.png">
    </div>

    <!--Switch Button-->
    <div class="switch-btn">
        <div class="onoffswitch">
            <input type="checkbox" name="onoffswitch" class="onoffswitch-checkbox toggle-switch-2" id="myonoffswitch" tabindex="0" checked>
            <label class="onoffswitch-label" for="myonoffswitch">
            <span class="onoffswitch-inner"></span>
            <span class="onoffswitch-switch"></span>
            </label>
        </div>
    </div>

    <script src="js/jquery-latest.min.js"></script>
    <script>
    $(document).ready(function () {
        var $offImg = $('.image-effect img').eq(0);   // images/off.png - theme toi
        var $onImg  = $('.image-effect img').eq(1);   // images/on.png  - theme sang

        function applyTheme(isOn) {
            if (isOn) {
                // ON -> nen sang
                $onImg.addClass('fadeEffect');
                $offImg.removeClass('fadeEffect');
                $('body').removeClass('dark-theme').addClass('light-theme');
            } else {
                // OFF -> nen toi
                $offImg.addClass('fadeEffect');
                $onImg.removeClass('fadeEffect');
                $('body').removeClass('light-theme').addClass('dark-theme');
            }
        }

        // Dong bo theme voi trang thai ban dau cua nut (dang checked = ON)
        applyTheme($('.toggle-switch-2').is(':checked'));

        $('.toggle-switch-2').on('change', function () {
            applyTheme($(this).is(':checked'));
        });
    });
    </script>
    
</body>

</html>
