<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Home</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2 class="text-center">Custom File Input</h2>

<div class="custom-file-wrp">
	<div class="filename">
		Ex:sample.jpg
	</div>
	<div class="custom-file">
		<label for="fileupload">Upload</label>
		<input type="file"  id="fileupload">
	</div>
</div>


<script src="js/jquery-latest.min.js"></script>
<script>
$(document).ready(function () {
	$('#fileupload').on('change', function () {
		if (this.files.length > 0) {
			// Ten file day du, gom ca phan mo rong (vd: anh.jpg)
			var fullName = this.files[0].name;
			$('.filename').text(fullName).css('color', '#333');
		} else {
			$('.filename').text('Ex:sample.jpg').css('color', '#999');
		}
	});
});
</script>

</body>
</html>
