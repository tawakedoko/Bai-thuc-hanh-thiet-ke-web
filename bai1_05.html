<!DOCTYPE html>
<html>
<head>
    <title>Định dạng văn bản</title>
</head>
<body>
    <h2 align="center"><font color="green">Định dạng văn bản</font></h2>

    <p>
        <b><u>Hóa học:</u></b> <i>Nước:</i> <font color="#FF0000">H<sub>2</sub>O</font> , <i>Axít Sunfuric:</i> <font color="#FF0000">H<sub>2</sub>SO<sub>4</sub></font>
    </p>

    <p>
        <b><u>Toán học:</u></b> <i>Phương trình bậc 2:</i> <font color="#FF0000">ax<sup>2</sup> + bx + c = 0</font>
    </p>

    <p>
        <b><u>Tin học:</u></b> <i>Vòng lặp For:</i>
    </p>
    <pre bgcolor="#CCCCCC"><font color="#0000CC"><b>
        For i = 0 To 10

            Tong = Tong + i

        Next
    </b></font></pre>
</body>
